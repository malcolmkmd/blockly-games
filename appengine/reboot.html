/**
 * The gauntlet: type queued commands while runaway processes drift in.
 * Too many processes on screen drains the core, so the student has to
 * interleave keyboard work with mouse swats.
 */
TASKS.gauntlet = {
  title: 'THE BIG TEST  [0/6]',
  hint: 'Type each command and press <kbd class="hot">ENTER</kbd>. Click the red boxes to pop them.',
  time: 110,
  retryTip: 'Tip: finish the word you are typing, then pop a red box.',
  run({ sb, done, mult }){
    const CMDS = ['seal the core', 'stop program 7', 'lock the vents',
                  'save the memory', 'block node b', 'raise firewall'];
    const NEED = 6;
    let index = 0;
    let procs = [];

    // --- typing console pinned to the bottom of the stage ---
    const console_ = el('div', 'term');
    console_.style.position = 'absolute';
    console_.style.left = '2%';
    console_.style.right = '2%';
    console_.style.bottom = '4%';
    console_.style.background = 'rgba(0,0,0,0.85)';
    const head = el('div', 'readout');
    const prompt = el('div', 'prompt');
    const input = el('input', 'typebox');
    input.type = 'text';
    input.autocomplete = 'off';
    input.spellcheck = false;
    console_.append(head, prompt, input);
    stage.appendChild(console_);

    const focus = () => input.focus();
    focus();
    sb.on(input, 'blur', () => setTimeout(focus, 0));
    // preventDefault on the stage keeps the caret in the console while swatting.
    sb.on(stage, 'pointerdown', (e) => { e.preventDefault(); focus(); });

    const render = () => {
      const target = CMDS[index];
      const val = input.value;
      head.textContent = 'COMMAND ' + (index + 1) + ' / ' + NEED;
      prompt.innerHTML = '';
      for (let i = 0; i < target.length; i++){
        const ch = target[i] === ' ' ? '\u00a0' : target[i];
        let cls = 'todo';
        if (i < val.length) cls = (val[i] === target[i]) ? 'ok' : 'bad';
        prompt.appendChild(el('span', cls + (i === val.length ? ' cursor' : ''), ch));
      }
    };

    sb.on(input, 'input', () => {
      State.stats.keys++;
      const t = CMDS[index], v = input.value, i = v.length - 1;
      if (i >= 0 && v[i] !== t[i]){ State.stats.typos++; Sfx.bad(); } else Sfx.clack();
      render();
    });

    sb.on(input, 'keydown', (e) => {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      if (input.value === CMDS[index]){
        Sfx.good();
        index++;
        input.value = '';
        $('#taskTitle').textContent = 'THE BIG TEST  [' + index + '/' + NEED + ']';
        if (index >= NEED){ done(true); return; }
        render();
      } else {
        Sfx.buzz();
        damage(3);
        console_.classList.add('shakeit');
        setTimeout(() => console_.classList.remove('shakeit'), 380);
      }
    });

    // --- drifting rogue processes ---
    const spawnProc = () => {
      if (procs.length > 7) return;
      const p = el('div', 'target proc pop-in', 'PROC ' + randInt(10, 99));
      p.style.width  = '4.6rem';
      p.style.height = '1.6rem';
      stage.appendChild(p);
      p.style.left = Math.round(rand(4, Math.max(10, stage.clientWidth - 90))) + 'px';
      p.style.top  = Math.round(rand(4, Math.max(10, stage.clientHeight * 0.55))) + 'px';
      const o = { node: p, x: parseFloat(p.style.left), y: parseFloat(p.style.top),
                  vx: rand(-1.4, 1.4) || 1, vy: rand(-0.9, 0.9) || 0.6 };
      procs.push(o);
      sb.on(p, 'pointerdown', (e) => {
        e.preventDefault();
        e.stopPropagation();
        Sfx.pop();
        State.stats.hits++;
        floaty('KILLED', o.x, o.y);
        p.remove();
        procs.splice(procs.indexOf(o), 1);
        focus();
      });
    };
    sb.interval(spawnProc, Math.round(1900 / (mult || 1)));
    spawnProc();

    // Drift + crowd pressure.
    sb.raf(() => {
      const w = stage.clientWidth, h = stage.clientHeight * 0.62;
      procs.forEach(o => {
        o.x += o.vx; o.y += o.vy;
        if (o.x < 0 || o.x > w - 76) o.vx *= -1;
        if (o.y < 0 || o.y > h) o.vy *= -1;
        o.node.style.left = clamp(o.x, 0, w - 76) + 'px';
        o.node.style.top  = clamp(o.y, 0, h) + 'px';
      });
    });
    sb.interval(() => {
      if (procs.length >= 5){ damage(2); Sfx.alarm(); }
    }, 1000);

    render();
  }
};

/**
 * Double-click to go into a folder, click the path to come back out.
 * Two files to find, the second one back up the other branch, so the
 * breadcrumb is the only sensible way home.
 */
TASKS.folders = {
  title: 'FIND THE FILES  [0/2]',
  hint: 'Double-click a folder to go inside. Click the path at the top to come back out.',
  time: 100,
  retryTip: 'Tip: two quick clicks opens a folder. One click just picks it.',
  run({ sb, done }){
    const GOALS = [
      { where: 'TAPES/1984', file: 'wake.log' },
      { where: 'NOTES',      file: 'hello.txt' }
    ];
    let goal = 0;
    let path = [DRIVE];

    const panel = el('div', 'panels');
    const box = el('div', 'panel');
    const head = el('div', 'panelhead');
    const crumbs = el('div', 'crumbs');
    const body = el('div', 'panelbody');
    const grid = el('div', 'filegrid');
    body.appendChild(grid);
    box.append(head, crumbs, body);
    panel.appendChild(box);
    stage.appendChild(panel);

    const here = () => path[path.length - 1];
    const pathText = () => path.slice(1).map(n => n.name).join('/');

    const sel = createSelection(sb, { items: () => Array.from(grid.children) });

    function open(node){
      if (node.kind === 'folder'){
        path.push(node);
        Sfx.blip();
        draw();
        return;
      }
      // A file: is it the one we were sent for?
      const g = GOALS[goal];
      if (node.name === g.file && pathText() === g.where){
        Sfx.good();
        State.stats.files++;
        goal++;
        $('#taskTitle').textContent = 'FIND THE FILES  [' + goal + '/2]';
        if (goal >= GOALS.length){ done(true); return; }
        draw();
      } else {
        Sfx.buzz();
        damage(2);
        flash('NOT THAT ONE', 'Check the name you were given.');
      }
    }

    function draw(){
      const g = GOALS[goal];
      head.innerHTML = '<span>DRIVE A</span><span>FIND: ' + g.where + '/' + g.file + '</span>';
      // Breadcrumb: every step back up is clickable except where we are.
      crumbs.innerHTML = '';
      path.forEach((node, i) => {
        if (i) crumbs.appendChild(el('span', null, '&rsaquo;'));
        const isHere = i === path.length - 1;
        const c = el('span', 'crumb' + (isHere ? ' here' : ''), node.name);
        if (!isHere){
          sb.on(c, 'click', () => { path = path.slice(0, i + 1); Sfx.click(); draw(); });
        }
        crumbs.appendChild(c);
      });

      grid.innerHTML = '';
      (here().children || []).forEach(child => {
        const tile = fileTile(child.name, child.kind);
        grid.appendChild(tile);
        sel.attach(tile);
        sb.on(tile, 'dblclick', (e) => { e.preventDefault(); open(child); });
        // Keyboard equivalent, so ENTER opens whatever is picked.
        tile.dataset.ref = child.name;
      });
      sel.clear();
    }

    sb.on(window, 'keydown', (e) => {
      if (!plainEnter(e) || inTextField(e)) return;
      const picked = sel.list()[0];
      if (!picked) return;
      e.preventDefault();
      const child = (here().children || []).find(c => c.name === picked.dataset.name);
      if (child) open(child);
    });

    draw();
  }
};

/**
 * Two drives side by side, a clipboard read-out and a step list.
 * Shared by both shortcut tasks. Clicking a drive makes it the active
 * one, so "where does the paste land" is something you can see.
 */
function makeCopyDesk(sb, leftName, rightName, names){
  const root = el('div', 'panels stack');
  const row  = el('div', 'panelrow');

  const build = (title) => {
    const p = el('div', 'panel');
    p.append(el('div', 'panelhead', '<span>' + title + '</span>'));
    const body = el('div', 'panelbody');
    const grid = el('div', 'filegrid');
    body.appendChild(grid);
    p.appendChild(body);
    return { panel: p, grid };
  };

  const left  = build(leftName);
  const right = build(rightName);
  row.append(left.panel, right.panel);

  const tray  = makeTray();
  const steps = el('ol', 'steps');
  root.append(row, tray.node, steps);
  stage.appendChild(root);

  names.forEach(n => left.grid.appendChild(fileTile(n, 'file')));

  const desk = {
    root, steps, tray,
    leftGrid: left.grid,
    rightGrid: right.grid,
    active: left.panel,
    isActive(which){ return desk.active === (which === 'left' ? left.panel : right.panel); },
    focus(which){
      desk.active = which === 'left' ? left.panel : right.panel;
      left.panel.classList.toggle('active', desk.active === left.panel);
      right.panel.classList.toggle('active', desk.active === right.panel);
    }
  };
  desk.focus('left');
  sb.on(left.panel,  'pointerdown', () => { desk.focus('left');  Sfx.click(); });
  sb.on(right.panel, 'pointerdown', () => { desk.focus('right'); Sfx.click(); });
  return desk;
}

/** Paint the step checklist: everything before `at` is ticked. */
function paintSteps(list, labels, at){
  list.innerHTML = '';
  labels.forEach((text, i) => {
    const li = el('li', i < at ? 'done' : (i === at ? 'now' : ''), text);
    list.appendChild(li);
  });
}

/**
 * Builds the manual scene: the scroller on top, an optional find box, and
 * the question with its answer field underneath.
 */
function manualScene(sb, opts, done){
  const root = el('div', 'panels stack');

  const panel = el('div', 'panel');
  panel.append(el('div', 'panelhead',
    '<span>NANA MANUAL, 1984</span><span>' + opts.where + '</span>'));
  const doc = makeDocPanel(sb, MANUAL);
  panel.appendChild(doc.node);
  root.appendChild(panel);

  if (opts.withFind){
    const row = el('div', 'findrow');
    row.appendChild(el('span', null, 'FIND:'));
    const find = el('input', 'typebox');
    find.type = 'text';
    find.autocomplete = 'off';
    find.spellcheck = false;
    row.appendChild(find);
    row.appendChild(el('span', 'label', 'ENTER jumps to the next one'));
    panel.appendChild(row);

    let hits = [], at = -1;
    sb.on(find, 'input', () => {
      const q = find.value.trim().toLowerCase();
      hits = [];
      doc.nodes.forEach((n, i) => {
        const on = q.length > 1 && n.textContent.toLowerCase().indexOf(q) >= 0;
        n.classList.toggle('hit', on);
        if (on) hits.push(i);
      });
      at = -1;
      Sfx.clack();
    });
    sb.on(find, 'keydown', (e) => {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      e.stopPropagation();
      if (!hits.length){ Sfx.buzz(); return; }
      at = (at + 1) % hits.length;
      doc.scrollToLine(hits[at]);
      Sfx.blip();
    });
  }

  const ask = el('div', 'panel grow0');
  ask.append(el('div', 'panelhead', '<span>NANA ASKS</span>'));
  const body = el('div', 'panelbody');
  body.appendChild(el('div', 'readout', opts.question));
  const answer = el('input', 'typebox');
  answer.type = 'text';
  answer.autocomplete = 'off';
  answer.spellcheck = false;
  body.appendChild(answer);
  ask.appendChild(body);
  root.appendChild(ask);
  stage.appendChild(root);

  doc.paint();
  answer.focus();

  sb.on(answer, 'keydown', (e) => {
    if (e.key !== 'Enter') return;
    e.preventDefault();
    const given = answer.value.trim().toLowerCase();
    if (given === String(opts.answer).toLowerCase()){
      Sfx.great();
      done(true);
    } else {
      Sfx.buzz();
      damage(3);
      answer.classList.add('shakeit');
      setTimeout(() => answer.classList.remove('shakeit'), 400);
      flash('NOT THAT', 'Keep reading. It is in the manual.');
    }
  });

  return { doc, answer };
}

/**
 * The box arrives with a broken line already in it. The job is to repair
 * it rather than retype it, so HOME, END, the arrow keys, BACKSPACE and
 * DELETE all get a workout. We count keystrokes and praise a tidy fix.
 */
function editTask(opts){
  return {
    title: opts.title,
    hint: 'Move with <kbd class="hot">&#8592;</kbd> <kbd class="hot">&#8594;</kbd>, jump with ' +
          '<kbd class="hot">HOME</kbd> and <kbd class="hot">END</kbd>, rub out with ' +
          '<kbd class="hot">BACKSPACE</kbd>. <kbd class="hot">ENTER</kbd> when it is right.',
    time: opts.time || 160,
    retryTip: 'Tip: you do not have to start again. Move the cursor to the mistake and fix it.',
    run({ sb, done }){
      const jobs = opts.jobs.slice();
      let at = 0, typed = 0;

      const box = el('div', 'center');
      const term = el('div', 'term');
      const head = el('div', 'readout');
      const want = el('div', 'prompt');
      const input = el('input', 'typebox');
      input.type = 'text';
      input.autocomplete = 'off';
      input.spellcheck = false;
      const note = el('div', 'label');
      term.append(head, want, input, note);
      box.appendChild(term);
      stage.appendChild(box);

      const focus = () => input.focus();
      sb.on(input, 'blur', () => setTimeout(focus, 0));
      sb.on(stage, 'pointerdown', (e) => {
        // Let the student click inside the field to place the cursor.
        if (e.target !== input){ e.preventDefault(); focus(); }
      });

      function load(){
        const job = jobs[at];
        typed = 0;
        head.innerHTML = 'FIX LINE ' + (at + 1) + ' OF ' + jobs.length +
                         ' &mdash; ' + job.why;
        want.textContent = 'IT SHOULD SAY:  ' + job.to;
        input.value = job.from;
        note.textContent = 'a tidy fix takes about ' + job.par + ' key presses';
        focus();
        // Park the cursor at the start so HOME and END mean something.
        setTimeout(() => { try { input.setSelectionRange(0, 0); } catch (e) {} }, 0);
      }

      sb.on(input, 'input', () => { typed++; State.stats.keys++; Sfx.clack(); });

      sb.on(input, 'keydown', (e) => {
        if (e.key !== 'Enter') return;
        e.preventDefault();
        const job = jobs[at];
        if (input.value.trim() !== job.to){
          Sfx.buzz();
          damage(3);
          term.classList.add('shakeit');
          setTimeout(() => term.classList.remove('shakeit'), 400);
          return;
        }
        State.stats.edits++;
        if (typed <= job.par + 4){
          Sfx.great();
          floaty('TIDY FIX!', 20, 20);
        } else {
          Sfx.good();
        }
        at++;
        $('#taskTitle').textContent = opts.title + '  [' + at + '/' + jobs.length + ']';
        if (at >= jobs.length){ done(true); return; }
        load();
      });

      load();
    }
  };
}

        'Helios building has ever had. Tomorrow you get a desk.'

  overlay.innerHTML = '';

    'You finished all ten acts and both machines are safe.<br>' +

  input.type = 'text';
  input.maxLength = 28;
  input.autocomplete = 'off';
  input.spellcheck = false;
  input.value = rememberedName();
  input.style.maxWidth = '22ch';
  input.style.textAlign = 'center';
  overlay.appendChild(input);

  const row = el('div', 'btnrow');
  const go = el('button', 'btn big go', 'MAKE MY CERTIFICATE');
  row.appendChild(go);
  overlay.appendChild(row);

  const submit = () => {
    const name = input.value.trim().replace(/\s+/g, ' ');
    if (!name){
      Sfx.buzz();
      input.classList.add('shakeit');
      setTimeout(() => input.classList.remove('shakeit'), 400);

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter'){ e.preventDefault(); submit(); }
  });
  setTimeout(() => input.focus(), 50);
}

/**
 * Play one part of the story, marking each act done as it is cleared.
 * Walks the steps by index so hard mode can rewind to the act card when
 * the player runs out of lives.
 */
async function runTimeline(steps){
  let currentAct = 0;      // act we are inside
  let actStart = 0;        // index of the card that opened it
  let doneAtActStart = 0;  // pip count when the act began
  let i = 0;

  while (i < steps.length){
    const step = steps[i];

    if (step.type === 'fx'){
      step.fn();
    } else if (step.type === 'card'){
      if (step.n !== currentAct){          // a genuinely new act, not a replay
        if (currentAct) markActDone(currentAct);
        fastDialogue = false;
        doneAtActStart = State.tasksDone;
        currentAct = step.n;
        actStart = i;
      }
      setAct(step.n, step.title);
      await showCard('ACT ' + step.n, step.title + '  -  ' + step.sub, step.ms);
    } else if (step.type === 'say'){
      await say(step.who, step.text);
    } else if (step.type === 'branch'){
      await say(step.who, savedPatch() ? step.ifSaved : step.ifWiped);
    } else if (step.type === 'task'){
      setStatus('YOUR TURN');
      const outcome = await playTask(step.task);
      setStatus('WELL DONE');
      $('#taskTitle').textContent = 'WAITING...';
      setHint('');

      if (outcome === 'restart-act'){
        State.actRestarts++;
        State.lives = HARD_LIVES;
        paintLives();
        State.tasksDone = doneAtActStart;
        paintPips();
        await outOfLives(currentAct);
        fastDialogue = true;     // they have read this act once already
        i = actStart;
        continue;
      }
    }
    i++;
  }

  if (currentAct) markActDone(currentAct);
  stage.innerHTML = '';
  clearTimerUI();
}

async function main(){
  setFace('calm');
  paintIntegrity();
  setHint('Waiting for you...');

  const mode = await titleScreen();

  if (mode === 'new'){
    buildPips(TIMELINE_1);
    paintPips();
    startClock('20:00');
    await runTimeline(TIMELINE_1);
    State.partOneSeconds = elapsed();
    const next = await showCelebration(1);
    if (next !== 'continue') return;
  } else {
    // Resuming: pick the story back up from the choice already on record.
    State.ending = rememberedEnding() || 'upload';
  }

  /* ---- Part 2: the machine downstairs ---- */
  State.part = 2;
  State.tasksDone = 0;
  State.integrity = Math.max(State.integrity, 70);
  paintIntegrity();
  buildPips(TIMELINE_2);
  paintPips();
  startClock('30:00');
  await runTimeline(TIMELINE_2);
  await showCelebration(2);
}

/*
 * Keep scrolling and focus-cycling inside the game surface. Tab is always
 * ours (the modals implement their own highlight), but text fields and
 * plain buttons keep their normal behaviour for everything else.
 */
window.addEventListener('keydown', (e) => {
  const tag = e.target && e.target.tagName;
  if (e.key === 'Tab'){ e.preventDefault(); return; }
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'BUTTON') return;
  if ([' ', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].indexOf(e.key) >= 0) e.preventDefault();
}, { capture: true });

main();

})();
</script>
